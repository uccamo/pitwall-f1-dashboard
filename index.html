<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101216">
<title>Pitwall – F1 Race Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#101216;--s1:#191C22;--s2:#252932;--tx:#ECEEF3;--dim:#9AA0AE;--acc:#FF5A5F;--onacc:#2A0507;--font:'Bricolage Grotesque','Google Sans',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--font);background:var(--bg);color:var(--tx);min-height:100vh;padding:max(16px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom))}
main{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button,select{font:inherit;color:inherit;border:0;cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
h1{font-size:2.6rem;font-weight:800;letter-spacing:-.04em;line-height:1}
h1 span{color:var(--acc)}
.sub{color:var(--dim);margin-top:4px}
.pick{display:flex;gap:8px}
select{background:var(--s2);border-radius:20px;padding:0 16px;height:52px;font-weight:600;appearance:none;-webkit-appearance:none;
background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);
background-position:calc(100% - 20px) 22px,calc(100% - 15px) 22px;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px;min-width:0}
#year{width:100px;flex:none}#race{flex:1}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:10px 18px;border-radius:16px;background:var(--s1);font-weight:600;color:var(--dim)}
.chip.on{background:var(--acc);color:var(--onacc)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--s1);padding:5px;border-radius:26px;position:sticky;top:6px;z-index:3}
.tabs button{background:none;padding:12px 4px;border-radius:21px;font-weight:600;color:var(--dim);transition:border-radius .2s,background .2s}
.tabs button.on{background:var(--s2);color:var(--tx);border-radius:16px}
.card{background:var(--s1);border-radius:32px;padding:18px}
.card h2{font-size:1rem;font-weight:600;color:var(--dim);margin-bottom:12px}

/* hero + podium */
.hero{background:var(--acc);color:var(--onacc);border-radius:40px 40px 40px 12px;padding:22px 22px 20px}
.hero h2{font-size:clamp(1.8rem,8vw,2.8rem);font-weight:800;letter-spacing:-.03em;line-height:1}
.hero p{margin-top:8px;font-weight:600;opacity:.8}
.podium{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;align-items:end}
.pod{padding:14px 10px;display:flex;flex-direction:column;justify-content:space-between;text-align:center;min-height:120px}
.pod b{font-size:2.2rem;font-weight:800;letter-spacing:-.03em;line-height:1}
.pod small{font-weight:600;opacity:.8;font-size:.78rem}
.pod span{font-weight:800;font-size:1.05rem}
.p1{min-height:190px;border-radius:44px 44px 16px 16px}.p2{min-height:150px;border-radius:28px 28px 12px 28px}.p3{min-height:120px;border-radius:28px 28px 28px 12px}
.rows{display:flex;flex-direction:column;gap:6px}
.row{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;background:var(--s2);padding:8px 14px 8px 8px;border-radius:20px}
.row:first-child{border-radius:26px 26px 20px 20px}.row:last-child{border-radius:20px 20px 26px 26px}
.pos{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-weight:800}
.row .nm{font-weight:600;line-height:1.15}.row .nm small{display:block;color:var(--dim);font-weight:400;font-size:.8rem}
.row .tm{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;font-size:.9rem}
.row .tm small{display:block;color:var(--dim);font-weight:400;font-size:.75rem}

/* charts + tiles */
svg.ch{width:100%;height:auto;display:block}
svg text{fill:var(--dim);font:11px var(--font)}
.cmp{display:flex;gap:8px;margin-bottom:12px}
.cmp select{flex:1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.tile{background:var(--s2);padding:14px;border-radius:24px}
.tile small{color:var(--dim);font-weight:600}.tile strong{display:block;font-size:1.5rem;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:.85rem;color:var(--dim);margin-bottom:12px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}
.tr{display:grid;grid-template-columns:42px 1fr;gap:8px;align-items:center;margin:6px 0}
.tr b{font-weight:800}
.stints{position:relative;display:flex;height:26px;border-radius:10px;overflow:hidden;background:var(--s2);gap:2px}
.stints span{display:grid;place-items:center;font-size:.72rem;font-weight:800;color:#111;min-width:0;overflow:hidden}
.msg{text-align:center;padding:36px 20px;background:var(--s1);border-radius:32px;color:var(--dim)}
.msg h2{color:var(--tx);font-size:1.2rem;margin-bottom:6px}
.msg button{margin-top:14px;background:var(--acc);color:var(--onacc);padding:12px 26px;border-radius:18px;font-weight:700}
.spin{width:34px;height:34px;border-radius:12px;background:var(--acc);margin:0 auto 14px;animation:sp 1.1s ease-in-out infinite}
@keyframes sp{0%{transform:rotate(0)}50%{border-radius:50%}100%{transform:rotate(180deg)}}
footer{text-align:center;font-size:.78rem;color:var(--dim)}footer a{color:inherit}
@media (prefers-reduced-motion:reduce){.spin{animation:none}*{transition:none!important}}
</style>
</head>
<body>
<main>
  <div><h1>Pit<span>wall</span></h1><p class="sub">Real Formula 1 data, loaded live</p></div>
  <div class="pick"><select id="year" aria-label="Season"></select><select id="race" aria-label="Race weekend"></select></div>
  <div class="chips" id="sessions"></div>
  <div class="tabs" id="tabs">
    <button data-t="res" class="on">Results</button><button data-t="pace">Pace</button><button data-t="tyre">Tyres</button><button data-t="wx">Weather</button>
  </div>
  <div id="view"></div>
  <footer>Data from <a href="https://openf1.org" target="_blank" rel="noopener">OpenF1</a>. Unofficial, not affiliated with Formula 1.</footer>
</main>

<script>
const $=s=>document.querySelector(s), BASE='https://api.openf1.org/v1/';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const cache=new Map(); let last=0;

/* Throttled fetch: OpenF1 free tier allows only a few requests per second */
async function api(path){
  if(cache.has(path))return cache.get(path);
  const wait=Math.max(0,last+380-Date.now()); last=Date.now()+wait; await sleep(wait);
  for(let a=1;a<=4;a++){
    const r=await fetch(BASE+path);
    if(r.status===404){cache.set(path,[]);return []}
    if(r.status===429){await sleep(1500*a);continue}
    if(!r.ok)throw new Error('API error '+r.status);
    const j=await r.json(); const out=Array.isArray(j)?j:[]; cache.set(path,out); return out;
  }
  throw new Error('Too many requests. Wait a few seconds and retry.');
}

/* ---- formatting ---- */
const lap=s=>{if(s==null||isNaN(s))return '–';const m=Math.floor(s/60);return m+':'+(s-m*60).toFixed(3).padStart(6,'0')};
const total=s=>{const h=Math.floor(s/3600),m=Math.floor(s%3600/60),r=s%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+r.toFixed(3).padStart(6,'0')};
const one=v=>Array.isArray(v)?[...v].reverse().find(x=>x!=null):v;
const gap=g=>{g=one(g);return typeof g==='number'?'+'+g.toFixed(3)+'s':(g||'')};
const nice=n=>String(n||'').split(' ').map(w=>w.length>1&&w===w.toUpperCase()?w[0]+w.slice(1).toLowerCase():w).join(' ');
const col=d=>'#'+((d&&d.team_colour)||'888888').replace('#','');
const ink=hex=>{const n=parseInt(hex.slice(1),16),l=(.299*(n>>16)+.587*(n>>8&255)+.114*(n&255));return l>150?'#111':'#fff'};
const median=a=>{const s=[...a].sort((x,y)=>x-y);return s[Math.floor(s.length/2)]};
const TYRE={SOFT:'#FF4B4B',MEDIUM:'#FFD43B',HARD:'#F2F2F2',INTERMEDIATE:'#3FD16A',WET:'#3D8BFF'};

/* ---- state ---- */
const S={year:null,meetings:[],meeting:null,sessions:[],session:null,drivers:{},results:[],stints:[],laps:[],wx:[],tab:'res',cmp:[0,1],tok:0};

/* ---- loading flow ---- */
const status=(t,sub)=>$('#view').innerHTML='<div class="msg"><div class="spin"></div><h2>'+t+'</h2>'+(sub||'')+'</div>';
const fail=(e,fn)=>{$('#view').innerHTML='<div class="msg"><h2>Could not load data</h2><p>'+esc(e.message||e)+'</p><button id="retry">Try again</button></div>';$('#retry').onclick=fn};

async function loadMeetings(){
  const tok=++S.tok; status('Loading race weekends');
  try{
    const all=await api('meetings?year='+S.year);
    if(tok!==S.tok)return;
    S.meetings=all.filter(m=>new Date(m.date_start)<new Date()).sort((a,b)=>new Date(a.date_start)-new Date(b.date_start));
    if(!S.meetings.length){$('#race').innerHTML='';$('#sessions').innerHTML='';return fail({message:'No completed race weekends found for '+S.year+'.'},loadMeetings)}
    $('#race').innerHTML=S.meetings.map((m,i)=>'<option value="'+i+'">'+esc(m.meeting_name)+'</option>').join('');
    $('#race').value=S.meetings.length-1;
    loadSessions();
  }catch(e){if(tok===S.tok)fail(e,loadMeetings)}
}
async function loadSessions(){
  const tok=++S.tok; S.meeting=S.meetings[+$('#race').value]; status('Loading sessions');
  try{
    const ss=await api('sessions?meeting_key='+S.meeting.meeting_key);
    if(tok!==S.tok)return;
    S.sessions=ss.sort((a,b)=>new Date(a.date_start)-new Date(b.date_start));
    const pick=S.sessions.find(s=>s.session_name==='Race')||S.sessions[S.sessions.length-1];
    renderChips(pick); loadSession(pick);
  }catch(e){if(tok===S.tok)fail(e,loadSessions)}
}
function renderChips(cur){
  $('#sessions').innerHTML=S.sessions.map(s=>'<button class="chip'+(s===cur?' on':'')+'" data-k="'+s.session_key+'">'+esc(s.session_name)+'</button>').join('');
}
async function loadSession(s){
  const tok=++S.tok; S.session=s; S.cmp=[0,1];
  try{
    status('Loading '+esc(s.session_name),'<p>Fetching drivers, results, tyres and laps</p>');
    const k='?session_key='+s.session_key;
    const drivers=await api('drivers'+k);
    const result=await api('session_result'+k);
    const stints=await api('stints'+k);
    const wx=await api('weather'+k);
    const laps=await api('laps'+k);
    if(tok!==S.tok)return;
    S.drivers={}; drivers.forEach(d=>S.drivers[d.driver_number]=d);
    S.stints=stints; S.laps=laps; S.wx=wx;
    S.results=result.length?result.filter(r=>S.drivers[r.driver_number]).sort((a,b)=>(a.position||99)-(b.position||99)):await fallbackOrder(k);
    render();
  }catch(e){if(tok===S.tok)fail(e,()=>loadSession(s))}
}
/* if the results endpoint has nothing, use the last known track positions */
async function fallbackOrder(k){
  const pos=await api('position'+k), lastP={};
  pos.forEach(p=>{lastP[p.driver_number]=p});
  return Object.values(lastP).filter(p=>S.drivers[p.driver_number]).sort((a,b)=>a.position-b.position).map(p=>({driver_number:p.driver_number,position:p.position}));
}

/* ---- charts ---- */
function chart(series,o){
  const W=600,H=o.h||250,pl=50,pr=10,pt=10,pb=24;
  const pts=series.flatMap(s=>s.pts.filter(Boolean));
  if(!pts.length)return '<p class="sub">No data for this session.</p>';
  const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);
  const x0=Math.min(...xs),x1=Math.max(...xs);let y0=Math.min(...ys),y1=Math.max(...ys);const pad=(y1-y0||1)*.08;y0-=pad;y1+=pad;
  const sx=x=>pl+(x-x0)/((x1-x0)||1)*(W-pl-pr), sy=y=>pt+(1-(y-y0)/(y1-y0))*(H-pt-pb);
  let g='';
  for(let i=0;i<=4;i++){const v=y0+(y1-y0)*i/4,y=sy(v);g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'" stroke="#2c313c"/><text x="'+(pl-6)+'" y="'+(y+4)+'" text-anchor="end">'+o.yf(v)+'</text>'}
  for(let i=0;i<=5;i++){const v=x0+(x1-x0)*i/5;g+='<text x="'+sx(v)+'" y="'+(H-6)+'" text-anchor="middle">'+o.xf(v)+'</text>'}
  const paths=series.map(s=>{
    let d='',px=null;
    s.pts.forEach(p=>{if(!p){px=null;return}d+=(px===null||p[0]-px>1.5&&!o.smooth?'M':'L')+sx(p[0]).toFixed(1)+' '+sy(p[1]).toFixed(1);px=p[0]});
    return '<path d="'+d+'" fill="none" stroke="'+s.color+'" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"'+(s.dash?' stroke-dasharray="8 6"':'')+'/>';
  }).join('');
  return '<svg class="ch" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.label)+'">'+g+paths+'</svg>';
}

/* ---- tabs ---- */
function render(){
  if(!S.session)return;
  ({res:viewRes,pace:viewPace,tyre:viewTyre,wx:viewWx})[S.tab]();
}
function hero(){
  const m=S.meeting;
  return '<div class="hero"><h2>'+esc(m.meeting_name)+'</h2><p>'+esc(m.circuit_short_name||m.location)+', '+esc(m.country_name)+'  –  '+esc(S.session.session_name)+',  '+new Date(S.session.date_start).toLocaleDateString('en',{day:'numeric',month:'short',year:'numeric'})+'</p></div>';
}
function viewRes(){
  const R=S.results; if(!R.length)return $('#view').innerHTML=hero()+'<div class="msg">No results available for this session.</div>';
  const stops={};S.stints.forEach(s=>stops[s.driver_number]=(stops[s.driver_number]||0)+1);
  const pod=[1,0,2].map(i=>{const r=R[i];if(!r)return '';const d=S.drivers[r.driver_number],c=col(d);
    return '<div class="pod p'+(i+1)+'" style="background:'+c+';color:'+ink(c)+'"><small>P'+(i+1)+'</small><b>'+esc(d.name_acronym)+'</b><span>'+esc(d.team_name)+'</span></div>'}).join('');
  const rows=R.map(r=>{const d=S.drivers[r.driver_number],c=col(d);
    const flag=r.dsq?'DSQ':r.dns?'DNS':r.dnf?'DNF':'';
    const t=r.position===1?(typeof one(r.duration)==='number'?(Array.isArray(r.duration)?lap(one(r.duration)):total(one(r.duration))):''):gap(r.gap_to_leader);
    const st=stops[r.driver_number];
    return '<div class="row"><div class="pos" style="background:'+c+';color:'+ink(c)+'">'+(flag?'–':r.position)+'</div>'+
      '<div class="nm">'+esc(nice(d.full_name))+'<small>'+esc(d.team_name)+'</small></div>'+
      '<div class="tm">'+(flag||t||'')+(st?'<small>'+(st-1)+' stop'+(st-1===1?'':'s')+'</small>':'')+'</div></div>'}).join('');
  $('#view').innerHTML=hero()+'<div class="card"><div class="podium">'+pod+'</div></div><div class="card"><h2>Classification</h2><div class="rows">'+rows+'</div></div>';
}
function driverLaps(num){
  const all=S.laps.filter(l=>l.driver_number==num&&l.lap_duration!=null&&!l.is_pit_out_lap).sort((a,b)=>a.lap_number-b.lap_number);
  if(!all.length)return {pts:[],best:null,avg:null};
  const med=median(all.map(l=>l.lap_duration)),ok=all.filter(l=>l.lap_duration<=med*1.12);
  return {pts:ok.map(l=>[l.lap_number,l.lap_duration]),best:Math.min(...all.map(l=>l.lap_duration)),avg:ok.reduce((a,l)=>a+l.lap_duration,0)/ok.length};
}
function viewPace(){
  const ord=S.results.map(r=>r.driver_number), opts=ord.map((n,i)=>'<option value="'+i+'">'+esc(S.drivers[n].name_acronym)+'  '+esc(nice(S.drivers[n].full_name))+'</option>').join('');
  if(ord.length<2)return $('#view').innerHTML=hero()+'<div class="msg">Not enough drivers to compare.</div>';
  const [a,b]=S.cmp, A=S.drivers[ord[a]],B=S.drivers[ord[b]], la=driverLaps(ord[a]), lb=driverLaps(ord[b]);
  const ca=col(A);let cb=col(B);const same=ca===cb;
  const diff=la.best!=null&&lb.best!=null?(la.best-lb.best):null;
  $('#view').innerHTML=hero()+'<div class="card"><h2>Lap times, driver vs driver</h2>'+
   '<div class="cmp"><select id="ca" aria-label="Driver A">'+opts+'</select><select id="cb" aria-label="Driver B">'+opts+'</select></div>'+
   '<div class="legend"><span><i style="background:'+ca+'"></i>'+esc(A.name_acronym)+'</span><span><i style="background:'+cb+'"></i>'+esc(B.name_acronym)+(same?' (dashed)':'')+'</span><span>Pit and safety car laps are left out</span></div>'+
   chart([{color:ca,pts:la.pts},{color:cb,pts:lb.pts,dash:same}],{yf:lap,xf:v=>'L'+Math.round(v),label:'Lap time comparison'})+
   '<div class="grid"><div class="tile"><small>'+esc(A.name_acronym)+' fastest</small><strong>'+lap(la.best)+'</strong></div><div class="tile"><small>'+esc(B.name_acronym)+' fastest</small><strong>'+lap(lb.best)+'</strong></div>'+
   '<div class="tile"><small>'+esc(A.name_acronym)+' average</small><strong>'+lap(la.avg)+'</strong></div><div class="tile"><small>'+esc(B.name_acronym)+' average</small><strong>'+lap(lb.avg)+'</strong></div></div>'+
   (diff!=null?'<p class="sub" style="margin-top:12px">'+esc(diff<=0?A.name_acronym:B.name_acronym)+' set the faster best lap by '+Math.abs(diff).toFixed(3)+' s.</p>':'')+'</div>';
  $('#ca').value=a;$('#cb').value=b;
  $('#ca').onchange=e=>{S.cmp[0]=+e.target.value;viewPace()};$('#cb').onchange=e=>{S.cmp[1]=+e.target.value;viewPace()};
}
function viewTyre(){
  if(!S.stints.length)return $('#view').innerHTML=hero()+'<div class="msg">No tyre data for this session.</div>';
  const maxLap=Math.max(...S.stints.map(s=>s.lap_end||0),...S.laps.map(l=>l.lap_number||0),1);
  const order=S.results.length?S.results.map(r=>r.driver_number):Object.keys(S.drivers);
  const rows=order.map(n=>{
    const ss=S.stints.filter(s=>s.driver_number==n).sort((x,y)=>x.stint_number-y.stint_number);if(!ss.length)return '';
    const segs=ss.map(s=>{const st=s.lap_start||1,en=s.lap_end||maxLap,len=en-st+1,c=TYRE[(s.compound||'').toUpperCase()]||'#888';
      return '<span style="flex:'+len+';background:'+c+'" title="'+esc(s.compound)+', laps '+st+' to '+en+'">'+(len>5?len:'')+'</span>'}).join('');
    return '<div class="tr"><b>'+esc(S.drivers[n]?.name_acronym||n)+'</b><div class="stints">'+segs+'</div></div>'}).join('');
  const leg=Object.entries(TYRE).map(([k,v])=>'<span><i style="background:'+v+'"></i>'+k[0]+k.slice(1).toLowerCase()+'</span>').join('');
  $('#view').innerHTML=hero()+'<div class="card"><h2>Tyre strategy by stint (numbers are laps)</h2><div class="legend">'+leg+'</div>'+rows+'</div>';
}
function viewWx(){
  const w=S.wx; if(!w.length)return $('#view').innerHTML=hero()+'<div class="msg">No weather data for this session.</div>';
  const t0=new Date(w[0].date).getTime(),X=r=>(new Date(r.date).getTime()-t0)/60000;
  const avg=k=>w.reduce((a,r)=>a+(+r[k]||0),0)/w.length, rain=w.some(r=>r.rainfall>0);
  $('#view').innerHTML=hero()+'<div class="card"><h2>Temperatures during the session</h2>'+
   '<div class="legend"><span><i style="background:#FF5A5F"></i>Track</span><span><i style="background:#6CC5FF"></i>Air</span></div>'+
   chart([{color:'#FF5A5F',pts:w.map(r=>[X(r),r.track_temperature])},{color:'#6CC5FF',pts:w.map(r=>[X(r),r.air_temperature])}],{yf:v=>Math.round(v)+'°',xf:v=>Math.round(v)+'m',smooth:true,label:'Track and air temperature'})+
   '<div class="grid"><div class="tile"><small>Track max</small><strong>'+Math.max(...w.map(r=>r.track_temperature)).toFixed(1)+'°C</strong></div>'+
   '<div class="tile"><small>Air average</small><strong>'+avg('air_temperature').toFixed(1)+'°C</strong></div>'+
   '<div class="tile"><small>Humidity</small><strong>'+Math.round(avg('humidity'))+'%</strong></div>'+
   '<div class="tile"><small>Rain</small><strong>'+(rain?'Yes':'No')+'</strong></div></div></div>';
}

/* ---- events ---- */
$('#tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.tab=b.dataset.t;[...$('#tabs').children].forEach(x=>x.classList.toggle('on',x===b));render()};
$('#sessions').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;const s=S.sessions.find(x=>x.session_key==b.dataset.k);renderChips(s);loadSession(s)};
$('#race').onchange=loadSessions;
$('#year').onchange=e=>{S.year=+e.target.value;loadMeetings()};
